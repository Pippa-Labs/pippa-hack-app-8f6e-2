# Quiet Time: how busy a London tube station is at a time and day, compared
# with that station's usual peak, and when it is quietest or busiest.
#
# Powered by TfL Open Data. Every figure comes from crowding.json, beside
# app.py, which scripts/build_data.py downloads from TfL's open crowding data
# (api.tfl.gov.uk/crowding) ahead of time. The app itself never calls TfL or
# anything else while it answers. (The attribution lives here and in the
# `source` field rather than in app.summary, which must never contain the
# word Pippa's badge splits on.)

manifest_version: 1

persistence: none

# The public author name (a pseudonym), shown with the app as "by <name>".
app_author_name: "poppynoteaming"

app:
  id: hack.app_8f6e_2
  name: Quiet Time
  version: 0.1.0
  summary: >-
    How busy a London tube station is at a time and day versus its usual peak,
    and when it is quietest or busiest. Uses TfL open data shipped with the
    app; nothing is looked up live and nothing is kept.

agent_types:
  - personal

outcomes:
  - id: crowding.at
    summary: How busy a tube station is at a time and day, as a percent of its usual peak
    example_phrases:
      - how busy is the tube station at
      - is the station busy at 8am
      - how crowded is the underground station on friday evening
      - will the tube be packed at
      - how rammed is the station at 6pm
      - is the platform busy right now at
      - busyness at the tube station at half five
      - is it crowded at the station on saturday
    inputs:
      - name: station
        type: string
        required: false
        description: >-
          The London Underground station the person named, as they wrote it,
          for example "Oxford Circus", "Kings X", "Tottenham Ct Rd" or "St
          Pauls". Leave out the words "station", "tube" and "underground". If
          no station is named, return an empty string rather than guessing.
      - name: day
        type: string
        required: false
        description: >-
          The day of the week the person asked about, as they wrote it, for
          example "Friday", "Sat", "weekday", "weekend", "tomorrow" or a date
          like "2026-12-04". If they did not mention a day, return an empty
          string rather than guessing.
      - name: time
        type: string
        required: false
        description: >-
          The clock time the person asked about, as they wrote it, for example
          "5:30pm", "17:30", "8am", "noon" or "now". Only a clock time: put
          "morning", "evening" or "rush hour" in window instead. If they did
          not give a time, return an empty string rather than guessing.
      - name: window
        type: string
        required: false
        description: >-
          The part of the day the person asked about, as they wrote it, for
          example "morning", "lunchtime", "afternoon", "evening", "night",
          "rush hour" or a range like "4pm-7pm". If they did not name one,
          return an empty string rather than guessing.
    output:
      - name: station
        type: string
        description: The tube station the figures are for, as TfL names it.
      - name: day
        type: string
        description: >-
          The day the figures are for, e.g. "Friday", or "Weekdays (Mon-Fri
          average)" / "Weekend (Sat-Sun average)".
      - name: time
        type: string
        required: false
        description: >-
          The clock time looked at, HH:MM in London time. Left out when the
          question named a day other than the current one but no time.
      - name: busyness_pct
        type: integer
        required: false
        description: >-
          How busy the station is at that time, as a percent of its typical
          peak (its busiest fifteen minutes in a normal week is 100).
      - name: level
        type: string
        required: false
        description: One of quiet, moderate, busy or very busy.
      - name: am_peak
        type: string
        description: TfL's morning peak band for that day, e.g. "08:15-10:15".
      - name: pm_peak
        type: string
        description: TfL's evening peak band for that day, e.g. "17:00-19:00".
      - name: quietest_time_in_window
        type: string
        description: >-
          Start (HH:MM) of the quietest fifteen minutes in the window asked
          about, or near the time asked about, or 06:00-23:00 when neither was
          given.
      - name: busiest_time
        type: string
        description: Start (HH:MM) of the busiest fifteen minutes of that day.
      - name: source
        type: string
        description: >-
          Where the figures come from and when they were downloaded, e.g. "TfL
          open data, downloaded 2026-11-20". Powered by TfL Open Data.

  - id: crowding.quietest
    summary: When a tube station is quietest, busiest or at rush hour on a given day
    example_phrases:
      - when is the station quietest
      - best time to go through the tube station
      - when is rush hour at the station
      - least crowded time at the underground station
      - when does the morning peak end at
      - quietest time to travel through on a weekday morning
      - when to avoid the crowds at the tube station
      - what time is the station busiest
    inputs:
      - name: station
        type: string
        required: false
        description: >-
          The London Underground station the person named, as they wrote it,
          for example "Oxford Circus", "Kings X", "Tottenham Ct Rd" or "St
          Pauls". Leave out the words "station", "tube" and "underground". If
          no station is named, return an empty string rather than guessing.
      - name: day
        type: string
        required: false
        description: >-
          The day of the week the person asked about, as they wrote it, for
          example "Friday", "Sat", "weekday", "weekend", "tomorrow" or a date
          like "2026-12-04". If they did not mention a day, return an empty
          string rather than guessing.
      - name: time
        type: string
        required: false
        description: >-
          The clock time the person asked about, as they wrote it, for example
          "5:30pm", "17:30", "8am", "noon" or "now". Only a clock time: put
          "morning", "evening" or "rush hour" in window instead. If they did
          not give a time, return an empty string rather than guessing.
      - name: window
        type: string
        required: false
        description: >-
          The part of the day the person asked about, as they wrote it, for
          example "morning", "lunchtime", "afternoon", "evening", "night",
          "rush hour" or a range like "4pm-7pm". If they did not name one,
          return an empty string rather than guessing.
    output:
      - name: station
        type: string
        description: The tube station the figures are for, as TfL names it.
      - name: day
        type: string
        description: >-
          The day the figures are for, e.g. "Friday", or "Weekdays (Mon-Fri
          average)" / "Weekend (Sat-Sun average)".
      - name: time
        type: string
        required: false
        description: >-
          The clock time looked at, HH:MM in London time. Left out when the
          question named a day other than the current one but no time.
      - name: busyness_pct
        type: integer
        required: false
        description: >-
          How busy the station is at that time, as a percent of its typical
          peak (its busiest fifteen minutes in a normal week is 100).
      - name: level
        type: string
        required: false
        description: One of quiet, moderate, busy or very busy.
      - name: am_peak
        type: string
        description: TfL's morning peak band for that day, e.g. "08:15-10:15".
      - name: pm_peak
        type: string
        description: TfL's evening peak band for that day, e.g. "17:00-19:00".
      - name: quietest_time_in_window
        type: string
        description: >-
          Start (HH:MM) of the quietest fifteen minutes in the window asked
          about, or near the time asked about, or 06:00-23:00 when neither was
